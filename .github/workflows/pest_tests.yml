name: Pest Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: pest-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pest_tests:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        php-versions: ['8.3']

    name: PHP ${{ matrix.php-versions }} | pest against Bagisto v2.4.10

    env:
      BAGISTO_VERSION: v2.4.10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bagisto
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout bagisto-api plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout Bagisto ${{ env.BAGISTO_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: bagisto/bagisto
          ref: ${{ env.BAGISTO_VERSION }}
          path: bagisto

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip, opcache
          ini-values: error_reporting=E_ALL, opcache.enable=1, opcache.enable_cli=1, opcache.validate_timestamps=0, opcache.max_accelerated_files=20000, opcache.memory_consumption=256
          coverage: none
          tools: composer:v2

      - name: Install Bagisto composer dependencies
        working-directory: bagisto
        run: composer install --no-interaction --prefer-dist

      - name: Wire plugin into Bagisto via composer path repository
        working-directory: bagisto
        run: |
          composer config repositories.bagisto-api path ../plugin
          composer require bagisto/bagisto-api:@dev --no-interaction --no-progress

      - name: Configure environment
        working-directory: bagisto
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(APP_DEBUG=\s*\).*$|\1true|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ job.services.mysql.ports['3306'] }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1bagisto|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          # Laravel 12 reads CACHE_STORE; CACHE_DRIVER alone leaves the app cache on `file`,
          # which is where API_PLATFORM_CACHE keeps the metadata pool — one flush of the app
          # cache would then take the metadata of every parallel worker with it.
          grep -q '^CACHE_STORE=' .env && sed -i "s|^CACHE_STORE=.*|CACHE_STORE=array|" .env || echo "CACHE_STORE=array" >> .env
          grep -q '^CACHE_DRIVER=' .env && sed -i "s|^CACHE_DRIVER=.*|CACHE_DRIVER=array|" .env || echo "CACHE_DRIVER=array" >> .env
          grep -q '^SESSION_DRIVER=' .env && sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=array|" .env || echo "SESSION_DRIVER=array" >> .env
          grep -q '^QUEUE_CONNECTION=' .env && sed -i "s|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|" .env || echo "QUEUE_CONNECTION=sync" >> .env
          grep -q '^API_PLATFORM_CACHE=' .env && sed -i "s|^API_PLATFORM_CACHE=.*|API_PLATFORM_CACHE=file|" .env || echo "API_PLATFORM_CACHE=file" >> .env
          cat .env

      - name: Run Bagisto installer
        working-directory: bagisto
        run: php artisan bagisto:install --skip-env-check --skip-admin-creation --skip-github-star

      - name: Run Bagisto API Platform installer
        working-directory: bagisto
        run: php artisan bagisto-api-platform:install

      - name: Expose plugin Tests namespace to host autoloader
        working-directory: bagisto
        run: |
          php -r '
            $file = "composer.json";
            $json = json_decode(file_get_contents($file), true);
            $json["autoload-dev"]["psr-4"]["Webkul\\BagistoApi\\Tests\\"] = "vendor/bagisto/bagisto-api/tests/";
            file_put_contents($file, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '
          composer dump-autoload --no-interaction

      - name: Suppress api-platform auto-discovery and clear caches
        working-directory: bagisto
        run: |
          php -r '$f="composer.json";$j=json_decode(file_get_contents($f),true);$d=$j["extra"]["laravel"]["dont-discover"]??[];if(!in_array("api-platform/laravel",$d,true))$d[]="api-platform/laravel";$j["extra"]["laravel"]["dont-discover"]=$d;file_put_contents($f,json_encode($j,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");'
          composer dump-autoload --no-interaction
          php artisan optimize:clear

      # Every worker otherwise builds the API Platform metadata for ~370 resources on its
      # first request. Four of them doing that at once on a 2-vCPU runner is the only
      # condition under which the GraphQL suites fail, and it has never reproduced off the
      # runner — not against the same install shape, the same cache store, the same opcache
      # settings, or a cold shared opcache file cache. Build the pool once, here, so that no
      # worker pays the cold start.
      - name: Warm the API metadata cache
        working-directory: bagisto
        run: php artisan bagisto-api-platform:warm-cache

      - name: Report the serializer stack
        working-directory: bagisto
        continue-on-error: true
        run: |
          for pkg in symfony/serializer api-platform/graphql api-platform/serializer api-platform/metadata; do
            composer show "$pkg" 2>/dev/null | grep -E "^(name|versions)" || true
          done
          php -r '
            require "vendor/autoload.php";
            foreach ([
              "ApiPlatform\\GraphQl\\Serializer\\ItemNormalizer",
              "ApiPlatform\\Serializer\\ItemNormalizer",
              "Symfony\\Component\\Serializer\\Normalizer\\AbstractNormalizer",
            ] as $c) {
              printf("%s\n  exists=%d setSerializer=%d\n  file=%s\n  parents=%s\n", $c, class_exists($c), method_exists($c, "setSerializer"), (new ReflectionClass($c))->getFileName(), implode(" < ", array_values(class_parents($c))));
            }
            printf("trait file=%s\n", (new ReflectionClass("Symfony\\Component\\Serializer\\SerializerAwareTrait"))->getFileName());
            printf("memory_limit=%s opcache=%d\n", ini_get("memory_limit"), (int) function_exists("opcache_get_status"));
          '
          free -m
          nproc

      - name: Run GraphQL APIs Pest (plugin suite)
        id: graphql_tests
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=2 --colors=always vendor/bagisto/bagisto-api/tests/Feature/GraphQL

      - name: Run REST APIs Pest (plugin suite)
        id: rest_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/RestApi

      - name: Run Admin GraphQL APIs Pest (plugin suite)
        id: admin_graphql_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=2 --colors=always vendor/bagisto/bagisto-api/tests/Feature/Admin/GraphQL

      - name: Run Admin REST APIs Pest (plugin suite)
        id: admin_rest_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/Admin/RestApi
        
      # Every suite runs even when an earlier one is red (continue-on-error above),
      # then this step fails the job if any of them did not pass.
      - name: Suite results
        if: always()
        run: |
          echo "GraphQL:        ${{ steps.graphql_tests.outcome }}"
          echo "REST:           ${{ steps.rest_tests.outcome }}"
          echo "Admin GraphQL:  ${{ steps.admin_graphql_tests.outcome }}"
          echo "Admin REST:     ${{ steps.admin_rest_tests.outcome }}"

          if [ "${{ steps.graphql_tests.outcome }}" != "success" ] \
            || [ "${{ steps.rest_tests.outcome }}" != "success" ] \
            || [ "${{ steps.admin_graphql_tests.outcome }}" != "success" ] \
            || [ "${{ steps.admin_rest_tests.outcome }}" != "success" ]; then
            echo "::error::One or more Pest suites failed."
            exit 1
          fi
